<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #121212; }
        #map { height: 100%; width: 100%; }
        .leaflet-container { background: #1a1a1a; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([0, 0], 2);
        
	L.tileLayer('tiles/{z}/{x}/{y}.png', {
    	    maxZoom: 16,
    	    minZoom: 10,
    	    attribution: 'Mapa offline'
	}).addTo(map);

        var iconFoguete = L.icon({
            iconUrl: 'marker-blue.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });
        var iconPouso = L.icon({
            iconUrl: 'marker-red.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        var fogueteMarker = L.marker([0, 0], {icon: iconFoguete}).addTo(map);
        var pousoMarker = L.marker([0, 0], {icon: iconPouso}).addTo(map);
        var primeiraAtualizacao = true;

        function atualizarPosicao(lat, lng, expLat, expLng) {
            var novaPos = new L.LatLng(lat, lng);
            var pousoPos = new L.LatLng(expLat, expLng);
            
            fogueteMarker.setLatLng(novaPos);
            pousoMarker.setLatLng(pousoPos);
            
            if (primeiraAtualizacao && lat !== 0 && lng !== 0) {
                map.setView(novaPos, 16);
                primeiraAtualizacao = false;
            }
        }
    </script>
</body>
</html>
